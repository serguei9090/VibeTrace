name: Publish to PyPI

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Rust + Python wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --features extension-module -m crates/vibetrace-core/Cargo.toml --out dist

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: dist

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: -m crates/vibetrace-core/Cargo.toml --out dist

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist

  pypi-publish:
    name: Publish release to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/vibetrace
    permissions:
      id-token: write  # Mandatory for PyPI OpenID Connect (OIDC) token exchange
      contents: read
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to PyPI via Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  verify-pypi-install:
    name: Verify PyPI install
    needs: [pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install vibetrace from PyPI and smoke test
        run: |
          uv python install 3.12
          for i in 1 2 3 4 5; do
            if uv tool install --refresh vibetrace; then
              break
            fi
            echo "Waiting for PyPI propagation (attempt $i)..."
            sleep 15
          done
          vibetrace --help
          mkdir -p /tmp/smoke_repo && echo "def hello(): return 'world'" > /tmp/smoke_repo/app.py
          vibetrace index /tmp/smoke_repo
          vibetrace search "hello" --root /tmp/smoke_repo
