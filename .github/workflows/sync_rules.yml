name: Sync Quality Rules Catalog

on:
  schedule:
    # Run every Sunday at midnight UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force re-compilation of full rules catalog'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync-rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv pip install -e ".[dev]"

      - name: Spin up SonarQube Server Container
        run: |
          docker run -d --name sonarqube-sync -p 9000:9000 sonarqube:26.2.0.119303-community
          echo "Waiting for SonarQube to become healthy..."
          for i in {1..30}; do
            STATUS=$(curl -s -u admin:admin http://localhost:9000/api/system/status | grep -o '"status":"[^"]*"' | cut -d'"' -f4 || true)
            if [ "$STATUS" = "UP" ]; then
              echo "SonarQube is UP!"
              break
            fi
            echo "Waiting ($i/30)..."
            sleep 5
          done

      - name: Export Consolidated Rules Manifest
        env:
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN || '' }}
        run: |
          uv run python scripts/export_rules_manifest.py \
            --url http://localhost:9000 \
            --token "$SONAR_TOKEN" \
            --langs all \
            --output src/vibetrace/resources/quality_rules_catalog.json \
            --gzip

      - name: Run Quality Test Suite
        run: |
          uv run pytest tests/test_quality_audit.py

      - name: Commit & Push Updated Catalog
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(quality): sync multi-language rules catalog [skip ci]"
          file_pattern: "src/vibetrace/resources/quality_rules_catalog.json* src/vibetrace/resources/cwe_catalog.json"
