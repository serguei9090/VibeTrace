[package]
name = "vibetrace-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "_rust_core"
crate-type = ["cdylib", "rlib"]

[features]
default = []
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py310"] }
ignore = "0.4"
rayon = "1.10"
sha2 = "0.10"
hex = "0.4"
globset = "0.4"
ort = { version = "=2.0.0-rc.15", features = ["ndarray", "download-binaries", "copy-dylibs"] }
ndarray = "0.17"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }
ureq = "2"

[target.'cfg(target_os = "windows")'.dependencies]
ort = { version = "=2.0.0-rc.15", features = ["directml"] }

[dev-dependencies]
tempfile = "3.14"
