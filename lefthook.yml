pre-commit:
  parallel: false
  commands:
    python-lint:
      glob: "*.py"
      run: uv run ruff check --fix {staged_files}
    python-format:
      glob: "*.py"
      run: uv run ruff format {staged_files}
    python-types:
      glob: "*.py"
      run: uv run pyright
    web-lint:
      glob: "src/web/**/*.{ts,tsx,js,json,css}"
      run: biome check --write {staged_files}
